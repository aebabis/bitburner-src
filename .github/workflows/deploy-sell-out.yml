name: "Deploy sell-out branch to pages"

on:
  push:
    branches: [sell-out]
  workflow_dispatch:
    inputs:
      enable_dev_mode:
        description: Enable dev mode (enable dev menu, disable minification, etc.)
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Shares the "pages" group with deploy-dev.yml so the two never race.
# In-progress deployments are allowed to finish rather than being cancelled.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Always publish sell-out, whatever ref the workflow was launched from.
          ref: sell-out
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - env:
          ENABLE_DEV_MODE: ${{ github.event.inputs.enable_dev_mode }}
        run: |
          if [[ "$ENABLE_DEV_MODE" == 'true' ]]; then
            npm run build:dev
          else
            npm run build
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ".app"
      - name: Deploy to gh pages
        id: deployment
        uses: actions/deploy-pages@v5
